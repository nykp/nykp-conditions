[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nykp_conditions"
version = "0.2"
authors = [
    {name = "Erik Schomburg", email = "eschomburg@gmail.com"},
]
description = ""
requires-python = ">=3.11"
dependencies = [
    "bs4",
    "feedparser",
    "matplotlib",
    "numpy",
    "pandas",
    "pendulum",
    "scipy",
    "seaborn",
    "slack-sdk",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nykp-conditions = "nykp_conditions.cli:main"

[tool.setuptools]
packages = ["nykp_conditions", "nykp_conditions.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
