name: Post daily conditions to Slack

on:
  # Triggered externally by a cron-job.org job that POSTs to the workflow
  # dispatch API at 8:30am America/New_York. GitHub's own `schedule:` trigger
  # was dropped because it ran 2-3 hours late, well past the ~8am window when
  # NotifyNYC posts waterbody advisories after heavy rain. The external
  # trigger also tracks DST, which a UTC cron cannot.
  workflow_dispatch:
    inputs:
      channel:
        description: 'Slack channel to post to'
        default: 'hudson-conditions'
        type: string

permissions:
  contents: read

jobs:
  post-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install .

      - name: Post conditions to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MPLBACKEND: Agg
        run: nykp-conditions post --channel "${{ github.event.inputs.channel || 'hudson-conditions' }}"
